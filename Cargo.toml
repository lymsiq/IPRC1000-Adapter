[package]
name = "iprc1000_native"
version = "0.4.34"
edition = "2021"

[features]
# 默认构建：完整界面（egui + OpenGL）
default = ["gui"]
gui = ["dep:eframe", "dep:egui"]
# 单独发行的 Win32 版：完全不链接 eframe/egui/OpenGL，
# 用 `--no-default-features --features win32_only` 构建。
win32_only = []

[dependencies]
# ── UI：egui（纯 Rust 即时渲染，无 WebView2）──
# 为什么换掉 Tauri：IPC 序列化 + 渲染进程生命周期 + 后台节流，
# 三样轮流出问题（界面卡死/数据不更新/显示假数据），而这些在 egui 里根本不存在。
eframe = { version = "0.29", optional = true, default-features = false, features = [
    "glow",            # OpenGL 后端，兼容性最好（不需要 wgpu/DX12）
    "default_fonts",   # 拉丁字体；中文另加载系统 msyh.ttc
] }
egui = { version = "0.29", optional = true }
# 托盘图标（egui 本身不做托盘）
tray-icon = { version = "0.19", features = ["common-controls-v6"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["ico", "png"] }

ferrisetw = "1.2"
hound = "3.5"
cpal = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.57", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",   # 「绑定程序」的文件选择框   # 精简面板原型（Win32 降级界面）用 ListView
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    # stderr 重定向到日志文件
    "Win32_System_Console",
    # 卸载脚本转 GBK（cmd 批处理编码）
    "Win32_Globalization",
    # 卸载：标记文件重启后删除
    "Win32_Storage_FileSystem",
    # 自测资源占用（内存/句柄/线程）
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
] }

[build-dependencies]
embed-manifest = "1.4"
# 把 icon.ico 嵌进 exe（资源管理器/任务栏的图标）
embed-resource = "2"

[profile.release]
opt-level = 3
lto = true
strip = true
